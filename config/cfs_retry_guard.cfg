# Include from printer.cfg after [include box.cfg]:
#   [include cfs_retry_guard.cfg]
# Requires /usr/share/klipper/klippy/extras/cfs_retry_guard.py. If an OTA
# removes that file while this include stays, Klipper refuses to start.
[cfs_retry_guard]
enabled: True
auto_resume: False
filament_sensor: filament_sensor
sensor_refresh_gcode: BOX_GET_FILAMENT_SENSOR_STATE
unreadable_policy: refuse
